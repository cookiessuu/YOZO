<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠星盘 YOZO · 示例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ============ 设计令牌 ============ */
  :root{
    --void:   #04060e;
    --deck:   #0a0f22;
    --ink:    #d7dcea;
    --ink-dim:#8b93b0;
    --gold:   #d4b879;
    --gold-hi:#f0e1b0;
    --gold-3: #85714a;
    --line:       rgba(212,184,121,.20);
    --line-soft:  rgba(212,184,121,.09);
    --glow:       rgba(212,184,121,.38);
    --serif: "Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --eng:   "Marcellus","Noto Serif SC",serif;
  }
  *{ box-sizing:border-box; }
  html{ color-scheme: dark; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:var(--serif);
    font-weight:300;
    background:
      radial-gradient(1100px 620px at 82% -8%, rgba(47,53,128,.32), transparent 62%),
      radial-gradient(900px 560px at 4% 108%, rgba(70,42,116,.24), transparent 62%),
      var(--void);
    background-attachment:fixed;
    overflow-x:hidden;
  }

  /* 星空层 */
  .sky{
    position:fixed; inset:0; width:100vw; height:100vh;
    pointer-events:none; z-index:0;
    opacity:.9;
  }
  .sky circle{ fill:#fff; }

  /* ============ 排版 ============ */
  .container{
    width:min(1180px, 92vw);
    margin:0 auto;
  }
  .masthead{
    position:relative; z-index:1;
    padding: 56px 0 10px;
  }
  .masthead h1{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(40px, 6vw, 62px);
    letter-spacing:.08em;
    color:#f3ead4;
  }
  .ornament{
    display:flex; align-items:center; gap:14px;
    margin:18px 0 14px; width:min(320px,60%);
  }
  .ornament::before,.ornament::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament::after{ background:linear-gradient(90deg, var(--gold), transparent); }
  .ornament i{
    width:6px; height:6px; flex:none;
    transform:rotate(45deg);
    border:1px solid var(--gold);
    box-shadow:0 0 10px var(--glow);
  }
  .sub{
    margin:0;
    color:var(--ink-dim);
    font-size:15px; letter-spacing:.14em;
  }

  /* ============ 布局 ============ */
  .layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: minmax(240px, 330px) 1fr;
    gap: clamp(24px, 4vw, 56px);
    align-items:start;
    padding: 34px 0 70px;
  }
  @media (max-width: 920px){
    .layout{ grid-template-columns: 1fr; }
    .form-panel{ order:2; }
    .stage-panel{ order:1; }
  }

  /* ============ 输入面板：雕版铭牌质感 ============ */
  .form-panel{
    position:relative;
    padding: 30px 28px 26px;
    border:1px solid var(--line);
    border-radius:4px;
    background: rgba(10,15,34,.55);
    box-shadow:
      inset 0 0 0 1px var(--line-soft),
      inset 0 0 60px rgba(5,8,20,.6);
  }
  .form-panel h2{
    margin:0 0 4px;
    font-size:22px; font-weight:600; letter-spacing:.2em;
    color:var(--gold-hi);
  }
  .form-panel .panel-note{
    margin:0 0 22px; font-size:12.5px; color:var(--ink-dim);
  }
  .field{ margin:0 0 20px; }
  .field label{
    display:block; margin-bottom:8px;
    font-size:13px; letter-spacing:.12em; color:#c7cee2;
  }
  .field input{
    width:100%;
    font-family:var(--eng);
    font-size:16px; color:var(--ink);
    padding:6px 2px 8px;
    background:transparent;
    border:none; border-bottom:1px solid var(--line-soft);
    border-radius:0;
    outline:none;
    transition:border-color .25s ease, box-shadow .25s ease;
    caret-color: var(--gold);
  }
  .field input::placeholder{ color:#5a6280; }
  .field input:focus-visible{
    border-bottom-color: var(--gold);
    box-shadow: 0 1px 0 var(--gold), 0 8px 18px -10px var(--glow);
  }
  .field input[type="date"]::-webkit-calendar-picker-indicator,
  .field input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(.72) sepia(.5) saturate(2) hue-rotate(5deg);
    opacity:.7; cursor:pointer;
  }

  .cta{
    width:100%; margin-top:8px;
    font-family:var(--serif);
    font-size:15px; letter-spacing:.42em; text-indent:.42em;
    color:var(--gold-hi);
    padding:13px 6px 12px;
    background: linear-gradient(180deg, rgba(212,184,121,.06), rgba(212,184,121,.02));
    border:1px solid var(--line); border-radius:3px;
    cursor:pointer;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease, color .25s ease;
  }
  .cta:hover{
    background: rgba(212,184,121,.12);
    border-color: var(--gold);
    box-shadow: 0 0 26px -6px var(--glow);
  }
  .cta:focus-visible{ outline:1px solid var(--gold-hi); outline-offset:3px; }
  .form-msg{
    margin:12px 0 0; min-height:1.2em;
    font-size:12.5px; color:var(--gold); letter-spacing:.04em;
  }
  .form-msg[aria-hidden="true"]{ visibility:hidden; }

  /* ============ 星盘舞台 ============ */
  .stage-panel{
    display:flex; flex-direction:column; align-items:center;
    gap:18px;
  }
  .stage{
    position:relative;
    width:100%; max-width:660px;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
  }
  .stage svg.wheel{
    width:100%; height:100%;
    display:block;
    opacity:0; transform:rotate(-7deg) scale(.9);
    transition: opacity .9s ease, transform 1.1s cubic-bezier(.16,.8,.24,1);
    pointer-events:none;
  }
  .stage.showing svg.wheel{
    opacity:1; transform:none; pointer-events:auto;
  }

  /* 空状态占位 */
  .empty{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center;
    transition: opacity .5s ease;
  }
  .stage.showing .empty{ opacity:0; pointer-events:none; }
  .empty .ring-hint{
    width:min(64%,64%);
    aspect-ratio:1/1;
    border:1px dashed rgba(212,184,121,.35);
    border-radius:50%;
    position:relative;
  }
  .empty .ring-hint::after{
    content:""; position:absolute; inset:26%;
    border:1px solid rgba(212,184,121,.14);
    border-radius:50%;
  }
  .empty p{
    position:absolute; top:56%;
    max-width:240px; margin:0;
    font-size:14.5px; line-height:1.9; color:var(--ink-dim);
    letter-spacing:.06em;
  }
  .empty .gem{
    width:9px; height:9px;
    transform:rotate(45deg);
    border:1px solid var(--gold);
    box-shadow:0 0 14px var(--glow);
    position:absolute; top:50%; left:50%; margin:-4px 0 0 -4px;
  }

  .birthline{
    font-family:var(--eng); font-size:14px;
    color:#cfc6a4; letter-spacing:.14em;
    text-align:center; min-height:1.4em;
  }
  .birthline b{ color:var(--gold-hi); font-weight:400; }

  /* 浮层提示 */
  .tip{
    position:absolute; z-index:5;
    width:236px;
    background: rgba(7,10,24,.94);
    border:1px solid var(--line);
    border-radius:4px;
    padding:13px 15px 12px;
    font-size:13px; line-height:1.85; color:#cdd3e4;
    box-shadow: 0 14px 40px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(5,8,18,.8);
    pointer-events:none;
    opacity:0; transform:translateY(4px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .tip.on{ opacity:1; transform:none; }
  .tip h4{
    margin:0 0 6px;
    font-size:13px; font-weight:600; letter-spacing:.18em;
    color:var(--gold-hi);
  }
  .tip .desc{
    margin:0; font-size:12px; color:#7d86a6; letter-spacing:.1em;
  }

  /* 星盘 SVG 内部元素 */
  .sector-fill{ fill:rgba(212,184,121,0); transition: fill .3s ease; }
  .sector-alt .sector-fill{ fill:rgba(212,184,121,.028); }
  .house-hit{ cursor:default; }
  .house-hit:hover .sector-fill,
  .house-hit:focus .sector-fill{ fill:rgba(212,184,121,.10); outline:none; }
  .bound{ stroke:rgba(212,184,121,.13); stroke-width:1; fill:none; }
  .bound.axis{ stroke:rgba(212,184,121,.42); }
  .ring{ fill:none; stroke:rgba(212,184,121,.32); }
  .ring.faint{ stroke:rgba(212,184,121,.13); }
  .sign-txt{ font-size:18px; fill:#a59769; letter-spacing:.12em; }
  .house-txt{ font-family:var(--eng); font-size:17px; fill:rgba(235,223,190,.85); }
  .pt-label{ font-size:15px; fill:#e7dcbc; letter-spacing:.06em; }
  .pt-core{ fill:#f3e3b4; }
  .pt-halo{ fill:none; stroke:rgba(243,227,180,.5); stroke-width:1; }
  .pt-hit{ fill:transparent; cursor:pointer; }
  .planet:hover .pt-core,
  .planet:focus .pt-core{ filter:drop-shadow(0 0 6px rgba(240,225,176,.9)); }
  .planet:focus{ outline:none; }
  /* 铭带文字不拦截指针，让下方宫位热区正常接收悬停 */
  .sector-zodiac{ fill:rgba(212,184,121,0); }
  .zodiac-hit:nth-child(odd) .sector-zodiac{ fill:rgba(212,184,121,.045); }
  .sector-zodiac, .sign-txt, .house-txt{ pointer-events:none; }
  .radline{ stroke:rgba(212,184,121,.10); stroke-width:1; }
  .center-rune{ fill:none; stroke:rgba(212,184,121,.30); }

  /* ============ 模态 ============ */
  .modal{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:22px;
    background:rgba(3,5,12,.6);
    backdrop-filter: blur(5px);
    opacity:0; pointer-events:none;
    transition: opacity .28s ease;
  }
  .modal.on{ opacity:1; pointer-events:auto; }
  .modal-card{
    position:relative;
    width:min(480px, 100%);
    max-height:82vh; overflow:auto;
    background:
      radial-gradient(520px 220px at 50% -10%, rgba(47,53,128,.22), transparent 70%),
      rgba(9,13,28,.97);
    border:1px solid var(--line); border-radius:5px;
    padding:34px 34px 30px;
    box-shadow: inset 0 0 0 1px var(--line-soft), 0 30px 90px -20px rgba(0,0,0,.85);
    transform: translateY(10px) scale(.98);
    transition: transform .28s ease;
  }
  .modal.on .modal-card{ transform:none; }
  .modal-close{
    position:absolute; top:12px; right:14px;
    width:34px; height:34px;
    background:transparent; border:none; cursor:pointer;
    color:#8b93b0; font-size:22px; line-height:1;
    border-radius:50%;
  }
  .modal-close:hover{ color:var(--gold-hi); }
  .modal-close:focus-visible{ outline:1px solid var(--gold); outline-offset:2px; }
  .modal-eyebrow{
    margin:0 0 8px;
    font-family:var(--eng); font-size:12px; letter-spacing:.3em;
    color:#8b93b0;
  }
  .modal-card h3{
    margin:0 0 2px;
    font-size:26px; font-weight:600; letter-spacing:.12em;
    color:var(--gold-hi);
  }
  .modal-place{
    margin:0 0 18px; font-family:var(--eng);
    font-size:13px; letter-spacing:.16em; color:#a89a6a;
  }
  .modal-rule{
    height:1px; border:none; margin:0 0 18px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .modal-card p.reading{
    margin:0 0 14px; font-size:15px; line-height:2.05;
    color:#d9deea; letter-spacing:.02em;
  }
  .modal-flag{
    margin:0; font-size:12px; color:#6f7794; letter-spacing:.08em;
  }

  /* ============ 页脚 ============ */
  footer.foot{
    position:relative; z-index:1;
    padding:0 0 46px;
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    border-top:1px solid var(--line-soft);
    padding-top:18px;
    font-size:12px; color:#6a7190; letter-spacing:.1em;
  }

  /* ============ 动效克制 ============ */
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .stage svg.wheel{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <svg class="sky" aria-hidden="true"></svg>

  <header class="masthead container">
    <h1>悠星盘</h1>
    <div class="ornament" aria-hidden="true"><i></i></div>
    <p class="sub">输入你的出生时刻，让天幕为你亮起</p>
  </header>

  <main class="layout container">

    <!-- 出生信息表单 -->
    <section class="form-panel" aria-label="出生信息">
      <h2>出生信息</h2>
      <p class="panel-note">日期与时间必填其一；城市用于记录。本页解读均为示例。</p>
      <form id="chartForm" novalidate>
        <div class="field">
          <label for="fDate">出生日期</label>
          <input id="fDate" name="date" type="date" value="1990-07-05" required>
        </div>
        <div class="field">
          <label for="fTime">出生时间</label>
          <input id="fTime" name="time" type="time" value="14:30">
        </div>
        <div class="field">
          <label for="fCity">出生城市</label>
          <input id="fCity" name="city" type="text" placeholder="例如：杭州" autocomplete="off">
        </div>
        <button class="cta" type="submit">生成星盘</button>
      </form>
      <p class="form-msg" id="formMsg" role="status" aria-hidden="true"></p>
    </section>

    <!-- 星盘舞台 -->
    <section class="stage-panel" aria-label="星盘">
      <div class="stage" id="stage">
        <div class="empty" id="emptyState">
          <div class="ring-hint"><span class="gem" aria-hidden="true"></span></div>
          <p>填写出生信息，点下「生成星盘」，<br>你的示例命盘将在此刻显影。</p>
        </div>
        <svg class="wheel" id="wheel" viewBox="0 0 760 760" role="img"
             aria-label="示例星盘：十二宫与行星位置"></svg>
        <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
      </div>
      <p class="birthline" id="birthLine" aria-live="polite"></p>
    </section>

  </main>

  <footer class="foot container">
    <span>星盘与解读为演示示例，仅供娱乐</span>
    <span>Natal Sphaera · Demo</span>
  </footer>

  <!-- 行星解读模态 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <p class="modal-eyebrow" id="modalEn"></p>
      <h3 id="modalTitle"></h3>
      <p class="modal-place" id="modalPlace"></p>
      <hr class="modal-rule">
      <p class="reading" id="modalBody"></p>
      <p class="modal-flag" id="modalFlag"></p>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var CX = 380, CY = 380;

  /* ---------- 演示数据 ---------- */
  var SIGNS = ["白羊座","金牛座","双子座","巨蟹座","狮子座","处女座","天秤座","天蝎座","射手座","摩羯座","水瓶座","双鱼座"];
  var ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

  // 十二宫：名称 / 小标题 / 解读文字（悬停浮层展示）
  var HOUSES = [
    { name:"命宫",   sub:"生命的开场", text:"你向世界展露的第一道光线在此凝聚——气质、倾向，以及留给别人的最初印象。它像序章，定下了这出人生剧的基调。" },
    { name:"财帛宫", sub:"价值与拥有", text:"它看你会如何积累、守护并运用自己的资源，也照见你对「安全感」的真实定义。你的财富观，在此成型。" },
    { name:"兄弟宫", sub:"言语与联结", text:"与手足、邻里及日常对话有关的领域，是学习、表达与短途行走的宫位。你的想法，在这里被说出、被听见。" },
    { name:"田宅宫", sub:"根与家", text:"这是你的内在根基、家庭与庇护之所。心之所安的地方，往往能在此宫找到线索。" },
    { name:"子女宫", sub:"创造与欢愉", text:"恋爱、才华、玩乐与孩子——所有让心发烫的事物都栖息于此。它是让你愿意去冒险、去表达爱的宫位。" },
    { name:"奴仆宫", sub:"身与日常", text:"身体、日常工作与照料他人。它轻声提醒你：把细碎的日常照料好，也就是在照料你自己。" },
    { name:"夫妻宫", sub:"镜子", text:"婚姻与重要合作落在这里。你在此遇见「另一半的自己」，学习如何与另一个独立的人并肩而行。" },
    { name:"疾厄宫", sub:"深渊与重生", text:"共有资源、债务、转变与疗愈。最深的地方往往藏着最可贵的成长，此宫关乎转化与新生。" },
    { name:"迁移宫", sub:"远方与意义", text:"异国、长途旅行、深造与信仰。它催促你走得更远，去追问那些更大问题的答案。" },
    { name:"官禄宫", sub:"天职与声望", text:"事业、公共形象与对世界的贡献。你渴望沿这条垂直的道路向上，被看见，也被记得。" },
    { name:"福德宫", sub:"星群与理想", text:"朋友、社群与对未来的希望。人海中的同路者在此出现，你的理想也因此有了回响。" },
    { name:"玄秘宫", sub:"幕后之海", text:"潜意识、独处与消融的边界。它收藏你不曾说出口的部分，也赠予你最沉厚的直觉。" }
  ];

  // 行星：度数(0°=正上，顺时针) / 名称 / 英文 / 解读（点击弹窗展示）
  var PLANETS = [
    { deg:285, name:"太阳", en:"Sun",   text:"太阳是你意志的恒星，描画你选择「活出什么」。它最亮的光落在你发光的方式上——你渴望被谁看见，又为何而燃。勇敢让自己成为中心，但别忘了把光分给同行的人。" },
    { deg:320, name:"水星", en:"Mercury", text:"水星是天空中的信使，牵动着你的思考与表达。它决定你如何理解世界、如何开口，也决定你听见的是话里的哪一层。保持好奇，也给言语留一丝转圜的余地。" },
    { deg:350, name:"月亮", en:"Moon",  text:"月亮照见你入睡前真正的样子。它掌管情绪、记忆与需要被安放的安全感，是你柔软而真实的底色。学着温柔对待它的潮汐，你会更懂得安抚自己。" },
    { deg:40,  name:"金星", en:"Venus", text:"金星主管爱、美与吸引。它告诉你怎样的相处让你舒展，怎样的风景让你驻足。你愿意为值得的人慢下来——这份鉴赏力，本身就是一种礼物。" },
    { deg:100, name:"火星", en:"Mars",  text:"火星是你体内的火焰，推动你去争取、去行动。它暴露你发怒的方式，也暴露你的勇气能走到多远。与其压抑这把火，不如为它找到值得奔赴的方向。" },
    { deg:160, name:"木星", en:"Jupiter", text:"木星带来扩张与好运，常在你回头时才显影。它指向你轻易相信与慷慨给予的地方，也指向命运轻轻推你一把的瞬间。多一点信任，机会常躲在拐角处等你。" },
    { deg:220, name:"土星", en:"Saturn", text:"土星是时间的雕刻家，教你等待与承担。它管辖责任、边界与长久的练习——一切值得的事都需要年月来沉淀。慢不是落后，稳是另一种快。" }
  ];

  /* ---------- 极坐标：0° 为 12 点方向，顺时针递增 ---------- */
  function P(deg, r){
    var rad = deg * Math.PI / 180;
    return { x: CX + r * Math.sin(rad), y: CY - r * Math.cos(rad) };
  }
  function mod(n, m){ return ((n % m) + m) % m; }
  function cuspOf(houseIndex){ // 第 houseIndex 宫的起始刻度（0..11，第1宫=ASC）
    return mod(270 - 30 * houseIndex, 360);
  }
  function degWithin(deg, cusp){ // 是否落在自 cusp 逆时针起的 30° 内
    return mod(deg - cusp, 360) < 30;
  }
  function houseOf(deg){
    for (var i = 0; i < 12; i++) if (degWithin(deg, cuspOf(i))) return i;
    return 0;
  }
  function signOf(deg){ return Math.floor(mod(deg - 270, 360) / 30); }

  /* 扇形路径：从圆心出发、沿弧线到另一边界 */
  function wedgePath(aDeg, bDeg, r){
    var p1 = P(aDeg, r), p2 = P(bDeg, r);
    // sweep=0 => 逆时针（角度递减），与十二宫刻度方向一致
    return "M" + CX + "," + CY +
           "L" + p1.x.toFixed(2) + "," + p1.y.toFixed(2) +
           "A" + r + "," + r + " 0 0 0 " + p2.x.toFixed(2) + "," + p2.y.toFixed(2) + "Z";
  }
  function ringArc(aDeg, bDeg, r1, r2){
    var pA1 = P(aDeg, r1), pB1 = P(bDeg, r1);
    var pA2 = P(aDeg, r2), pB2 = P(bDeg, r2);
    return "M" + pA1.x.toFixed(2) + "," + pA1.y.toFixed(2) +
           "A" + r1 + "," + r1 + " 0 0 0 " + pB1.x.toFixed(2) + "," + pB1.y.toFixed(2) +
           "L" + pB2.x.toFixed(2) + "," + pB2.y.toFixed(2) +
           "A" + r2 + "," + r2 + " 0 0 1 " + pA2.x.toFixed(2) + "," + pA2.y.toFixed(2) + "Z";
  }

  var R_OUT = 316, R_ZB = 252, R_PT = 202, R_LBL = 228, R_ROM = 130, R_IN = 96;

  /* ---------- 浮层提示 ---------- */
  var stage = document.getElementById("stage");
  var tip   = document.getElementById("tip");
  var tipTimer;
  function hideTip(){ tip.classList.remove("on"); tip.setAttribute("aria-hidden","true"); }
  function showTipAt(html, ux, uy, anchorPx){
    tip.innerHTML = html;
    tip.classList.add("on");
    tip.setAttribute("aria-hidden","false");
    var rect = stage.getBoundingClientRect();
    var scale = rect.width / 760;
    var left, top;
    if (anchorPx){
      left = anchorPx.clientX - rect.left + 16;
      top  = anchorPx.clientY - rect.top - 10;
    } else {
      left = (ux - 380) * scale + rect.width/2;
      top  = (uy - 380) * scale + rect.height/2;
    }
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    if (left + tw > rect.width  - 4) left = rect.width  - tw - 4;
    if (left < 4) left = 4;
    if (top  + th > rect.height - 4) top  = rect.height - th - 4;
    if (top  < 4) top = 4;
    tip.style.left = left + "px";
    tip.style.top  = top  + "px";
  }

  /* ---------- 构建星盘 ---------- */
  function buildWheel(){
    var svg = document.getElementById("wheel");
    var ns = "http://www.w3.org/2000/svg";
    function el(tag, cls, attrs){
      var n = document.createElementNS(ns, tag);
      if (cls) n.setAttribute("class", cls);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function addTxt(tag, x, y, content){
      var t = el("text", tag, { x:x, y:y, "text-anchor":"middle" });
      t.textContent = content;
      return t;
    }

    var wrap = el("g", "ring-in", {});
    svg.appendChild(wrap);

    /* 底盘 */
    wrap.appendChild(el("circle", "ring", { cx:CX, cy:CY, r:R_OUT }));
    wrap.appendChild(el("circle", "ring faint", { cx:CX, cy:CY, r:R_ZB }));
    wrap.appendChild(el("circle", "ring faint", { cx:CX, cy:CY, r:R_IN }));

    /* 十二宫扇形（悬停热区 + 微弱交替底） */
    for (var i = 0; i < 12; i++){
      var cusp = cuspOf(i);
      var end  = mod(cusp - 30, 360);
      var g = el("g", "house-hit" + (i % 2 ? " sector-alt" : ""), { tabindex:"0", role:"group", "aria-label":"第"+ROMAN[i]+"宫 "+HOUSES[i].name+"，悬停查看解读" });
      g.appendChild(el("path", "sector-fill", { d: wedgePath(cusp, end, R_OUT) }));

      (function(idx, gg, cu){
        gg.addEventListener("mouseenter", function(e){
          var mid = mod(cu - 15, 360);
          var c = P(mid, 150);
          var html = tipHtml(idx);
          showTipAt(html, c.x, c.y, e);
        });
        gg.addEventListener("mousemove", function(e){
          var rect = stage.getBoundingClientRect();
          var left = e.clientX - rect.left + 16, top = e.clientY - rect.top - 10;
          var tw = tip.offsetWidth, th = tip.offsetHeight;
          if (left + tw > rect.width - 4) left = rect.width - tw - 4;
          if (left < 4) left = 4;
          if (top + th > rect.height - 4) top = rect.height - th - 4;
          if (top < 4) top = 4;
          tip.style.left = left + "px"; tip.style.top = top + "px";
        });
        gg.addEventListener("mouseleave", hideTip);
        gg.addEventListener("focus", function(e){
          var mid = mod(cu - 15, 360);
          var c = P(mid, 150);
          showTipAt(tipHtml(idx), c.x, c.y, null);
        });
        gg.addEventListener("blur", hideTip);
        gg.addEventListener("keydown", function(e){ if (e.key === "Escape") hideTip(); });
      })(i, g, cusp);

      wrap.appendChild(g);
    }

    function tipHtml(idx){
      return "<h4>" + ROMAN[idx] + " · " + HOUSES[idx].name + "</h4>" +
             "<p class='desc'>" + HOUSES[idx].sub + "</p>" +
             "<p>" + HOUSES[idx].text + "</p>";
    }

    /* 黄道十二星座铭带 */
    var signG = el("g", "", {});
    for (var s = 0; s < 12; s++){
      var cuspS = cuspOf(s);
      var endS  = mod(cuspS - 30, 360);
      var zg = el("g", "zodiac-hit", {});
      zg.appendChild(el("path", "sector-zodiac", { d: ringArc(cuspS, endS, R_ZB, R_OUT) }));
      var midP = P(mod(cuspS - 15, 360), 284);
      zg.appendChild(addTxt("sign-txt", midP.x, midP.y, SIGNS[s]));
      signG.appendChild(zg);
    }
    wrap.appendChild(signG);

    /* 宫位放射刻度线 */
    for (var h = 0; h < 12; h++){
      var ca = cuspOf(h), p1 = P(ca, R_IN), p2 = P(ca, R_OUT);
      wrap.appendChild(el("line", h % 3 === 0 ? "bound axis" : "bound",
        { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y }));
    }

    /* 罗马数字宫号（横向正立，靠近内环） */
    for (var r = 0; r < 12; r++){
      var midP2 = P(mod(cuspOf(r) - 15, 360), R_ROM);
      wrap.appendChild(addTxt("house-txt", midP2.x, midP2.y, ROMAN[r]));
    }

    /* 行星 */
    var PL = PLANETS.length;
    for (var p = 0; p < PL; p++){
      var plan = PLANETS[p];
      var pos = P(plan.deg, R_PT);
      var lbl = P(plan.deg, R_LBL);
      var hi  = houseOf(plan.deg);
      var sg  = signOf(plan.deg);

      var g2 = el("g", "planet", {});
      g2.setAttribute("data-plan", p);
      g2.setAttribute("role", "button");
      g2.setAttribute("aria-label", plan.name + "（"+ SIGNS[sg] +" · 第"+ROMAN[hi]+"宫），回车查看解读");
      g2.setAttribute("tabindex", "0");

      g2.appendChild(el("circle", "pt-halo",  { cx:pos.x, cy:pos.y, r: plan.en === "Sun" ? 11 : 9 }));
      g2.appendChild(el("circle", "pt-halo",  { cx:pos.x, cy:pos.y, r: plan.en === "Sun" ? 7  : 5, opacity:.7 }));
      g2.appendChild(el("circle", "pt-core",  { cx:pos.x, cy:pos.y, r: plan.en === "Sun" ? 5.2 : 3.6 }));
      g2.appendChild(el("circle", "pt-hit",   { cx:pos.x, cy:pos.y, r: 15 }));

      var tL = addTxt("pt-label", lbl.x, lbl.y + 5, plan.name);
      tL.setAttribute("text-anchor", (mod(plan.deg,360) < 180) ? "start" : "end");
      // 修正极上/极下的锚点，让文字贴近行星
      var d = mod(plan.deg, 360);
      if (d > 60 && d < 120 || d > 240 && d < 300) tL.setAttribute("text-anchor", "middle");
      g2.appendChild(tL);

      g2.addEventListener("click", function(e){ e.stopPropagation(); openPlanet(+this.getAttribute("data-plan")); });
      g2.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openPlanet(+this.getAttribute("data-plan")); }
      });

      wrap.appendChild(g2);
    }

    /* 四轴主线（ASC—DSC 横轴） */
    var a1 = P(270, R_OUT), a2 = P(90, R_OUT);
    wrap.appendChild(el("line", "ring", { x1:a1.x, y1:a1.y, x2:a2.x, y2:a2.y, opacity:.28 }));
    var a3 = P(0, R_OUT), a4 = P(180, R_OUT);
    wrap.appendChild(el("line", "ring", { x1:a3.x, y1:a3.y, x2:a4.x, y2:a4.y, opacity:.28 }));

    /* 圆心点缀 */
    wrap.appendChild(el("circle", "center-rune", { cx:CX, cy:CY, r:26 }));
    wrap.appendChild(el("circle", "pt-core", { cx:CX, cy:CY, r:3, opacity:.9 }));
  }

  /* ---------- 行星弹窗 ---------- */
  var modal = document.getElementById("modal");
  var lastFocus = null;
  function openPlanet(i){
    var pl = PLANETS[i];
    var hi = houseOf(pl.deg), sg = signOf(pl.deg);
    document.getElementById("modalEn").textContent    = "LUMINARY · " + pl.en.toUpperCase();
    document.getElementById("modalTitle").textContent = pl.name;
    document.getElementById("modalPlace").textContent = SIGNS[sg] + " · " + ROMAN[hi] + "宫 · 示例落位";
    document.getElementById("modalBody").textContent  = pl.text;
    document.getElementById("modalFlag").textContent  = "本页为演示数据，解读仅供娱乐，不构成任何建议。";
    lastFocus = document.activeElement;
    modal.classList.add("on");
    document.getElementById("modalClose").focus();
    document.body.style.overflow = "hidden";
  }
  function closeModal(){
    modal.classList.remove("on");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && modal.classList.contains("on")) closeModal(); });

  /* ---------- 生成 ---------- */
  var stagePanel = document.getElementById("stage");
  var form = document.getElementById("chartForm");
  var msg  = document.getElementById("formMsg");
  var birthLine = document.getElementById("birthLine");
  var built = false;

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var d = document.getElementById("fDate");
    if (!d.value){ say("请先选择你的出生日期。"); d.focus(); return; }
    if (!built){
      buildWheel();
      built = true;
    }
    stagePanel.classList.add("showing");
    document.getElementById("emptyState").style.display = "none";
    updateBirthline();
    say("");
  });

  function updateBirthline(){
    var d = document.getElementById("fDate").value;
    var t = document.getElementById("fTime").value;
    var c = document.getElementById("fCity").value.trim();
    var dateStr = d ? d.replace(/-/g, ".") : "";
    var parts = [dateStr, t, c].filter(Boolean);
    birthLine.innerHTML = "出生 <b>" + (parts.join(" · ") || "（时间未知）") + "</b> · 演示星盘";
  }

  function say(t){
    msg.textContent = t;
    msg.setAttribute("aria-hidden", t ? "false" : "true");
  }

  /* ---------- 星野 ---------- */
  (function paintSky(){
    var sky = document.querySelector(".sky");
    var ns = "http://www.w3.org/2000/svg";
    function mk(tag, attrs){
      var n = document.createElementNS(ns, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    // 静谧星点
    for (var i = 0; i < 170; i++){
      var r = Math.random() * 1.1 + 0.25;
      var o = Math.random() * .5 + .12;
      var c = mk("circle", { cx: Math.random()*100+"%", cy: Math.random()*100+"%",
                             r: r.toFixed(2), opacity: o.toFixed(2) });
      sky.appendChild(c);
    }
    // 少量闪烁亮星
    for (var j = 0; j < 14; j++){
      var sc = Math.random() * 1.6 + .8;
      var x = Math.random() * 100, y = Math.random() * 100;
      var g = mk("g", {});
      var dur = (6 + Math.random() * 6).toFixed(1);
      var delay = (Math.random() * 8).toFixed(1);
      g.appendChild(mk("circle", { cx:x+"%", cy:y+"%", r:sc.toFixed(2), opacity:.85 }));
      g.appendChild(mk("circle", { cx:x+"%", cy:y+"%", r:(sc*2.4).toFixed(2), opacity:.18 }));
      g.style.animation = "tw " + dur + "s ease-in-out " + delay + "s infinite";
      sky.appendChild(g);
    }
    var sty = document.createElement("style");
    sty.textContent = "@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}" +
                      "@media (prefers-reduced-motion: reduce){ [style*='animation']{animation:none !important} }";
    document.head.appendChild(sty);
  })();

  // 默认聚焦日期，方便直接回车生成
  document.getElementById("fDate").focus();
})();
</script>
</body>
</html>
